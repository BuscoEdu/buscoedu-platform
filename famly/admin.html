<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FAMLY · Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b;font-size:16px}
.login{max-width:360px;margin:40px auto;padding:24px;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.login h1{font-size:1.3rem;margin-bottom:16px;text-align:center}
.login input{width:100%;padding:14px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px;font-size:1rem}
.login button{width:100%;padding:14px;background:#6366f1;color:#fff;border:0;border-radius:12px;font-weight:700;font-size:1rem}
.app{display:none}
header{background:#1e293b;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:1.1rem}
header button{background:#ef4444;color:#fff;border:0;padding:8px 14px;border-radius:8px;font-size:.85rem}
nav{display:flex;background:#fff;border-bottom:1px solid #e2e8f0;overflow-x:auto;position:sticky;top:52px;z-index:9}
nav button{flex:none;background:none;border:0;padding:12px 16px;font-weight:600;color:#64748b;font-size:.9rem;white-space:nowrap}
nav button.on{color:#6366f1;border-bottom:2px solid #6366f1}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:16px;border:1px solid #e2e8f0}
.card h3{font-size:.75rem;color:#64748b;margin-bottom:4px}
.card .num{font-size:1.6rem;font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border-radius:12px;padding:14px;border:1px solid #e2e8f0}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item-title{font-weight:600;font-size:.95rem}
.item-sub{font-size:.8rem;color:#64748b;margin-top:2px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:600}
.badge.activa{background:#dcfce7;color:#166534}
.badge.suspendida{background:#fee2e2;color:#991b1b}
.badge.error{background:#fee2e2;color:#991b1b}
.badge.sugerencia{background:#dbeafe;color:#1e40af}
.badge.nuevo{background:#fef3c7;color:#92400e}
.badge.revisado{background:#e2e8f0;color:#475569}
.btn{background:#6366f1;color:#fff;border:0;padding:6px 10px;border-radius:6px;font-size:.75rem}
.btn.sec{background:#e2e8f0;color:#1e293b}
.search{margin-bottom:12px}
.search input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:.95rem}
.detail{background:#fff;border-radius:12px;padding:16px;border:1px solid #e2e8f0;margin-top:12px}
.detail h2{font-size:1.1rem;margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:.9rem}
.row span:first-child{color:#64748b}
.toast{position:fixed;bottom:16px;left:16px;right:16px;background:#1e293b;color:#fff;padding:12px;border-radius:10px;text-align:center;display:none}
@media(min-width:640px){
  .grid{grid-template-columns:repeat(4,1fr)}
  main{max-width:800px;margin:0 auto}
}
</style>
</head>
<body>
<div class="app" id="app" style="display:block">
  <header>
    <h1>FAMLY Admin</h1>
    <button onclick="salir()">Salir</button>
  </header>
  <nav>
    <button class="on" onclick="sec('dash',this)">Inicio</button>
    <button onclick="sec('fams',this)">Familias</button>
    <button onclick="sec('hall',this)">Hallazgos</button>
    <button onclick="sec('adm',this)">Admins</button>
  </nav>
  <main>
    <div id="s-dash">
      <div class="grid" id="grid"></div>
    </div>
    <div id="s-fams" style="display:none">
      <div class="search"><input id="qFam" placeholder="Buscar familia..." oninput="renderFams()"></div>
      <div class="list" id="listFams"></div>
      <div id="detFam" class="detail" style="display:none"></div>
    </div>
    <div id="s-hall" style="display:none">
      <div class="search"><input id="qHall" placeholder="Buscar..." oninput="renderHall()"></div>
      <div class="list" id="listHall"></div>
    </div>
    <div id="s-adm" style="display:none">
      <div class="list" id="listAdm"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const URL='https://khnrnnoxyzuulagemfbh.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtobnJubm94eXp1dWxhZ2VtZmJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzM1NTMsImV4cCI6MjA5ODEwOTU1M30.uN8Vm9H-Na92r6UPOsP39F6pGwU6M_K6C4HJ5Tq-2Ts';
const PASS='famly-super-2026';
const sb={
  from: (table) => ({
    select: (cols) => ({
      order: (col, opts) => fetch(`${URL}/rest/v1/${table}?select=${cols}&order=${col}.${opts?.ascending===false?'desc':'asc'}`, {
        headers: {'apikey': KEY, 'Authorization': 'Bearer '+KEY}
      }).then(r => r.json()).then(data => ({data, error: null})).catch(e => ({data: null, error: e})),
      eq: (col, val) => fetch(`${URL}/rest/v1/${table}?${col}=eq.${val}&select=${cols}`, {
        headers: {'apikey': KEY, 'Authorization': 'Bearer '+KEY}
      }).then(r => r.json()).then(data => ({data, error: null})).catch(e => ({data: null, error: e}))
    })
  })
};
let fams=[], mems=[], halls=[], admins=[], cfgs=[];

function salir(){location.reload();}
function sec(id,btn){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  ['dash','fams','hall','adm'].forEach(s=>document.getElementById('s-'+s).style.display=s===id?'block':'none');
  if(id==='fams') renderFams();
  if(id==='hall') renderHall();
  if(id==='adm') renderAdm();
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}

async function load(){
  const h = {'apikey': KEY, 'Authorization': 'Bearer '+KEY};
  try {
    const [f,m,ha,a,c] = await Promise.all([
      fetch(URL+'/rest/v1/familia_familias?select=*&order=id', {headers:h}).then(r=>r.json()),
      fetch(URL+'/rest/v1/familia_miembros?select=id,nombre,rol,es_admin,familia_id,puntos', {headers:h}).then(r=>r.json()),
      fetch(URL+'/rest/v1/famly_hallazgos?select=*&order=creado_en.desc', {headers:h}).then(r=>r.json()),
      fetch(URL+'/rest/v1/familia_admins?select=*', {headers:h}).then(r=>r.json()),
      fetch(URL+'/rest/v1/familia_config?select=*', {headers:h}).then(r=>r.json())
    ]);
    fams = Array.isArray(f) ? f : [];
    mems = Array.isArray(m) ? m : [];
    halls = Array.isArray(ha) ? ha : [];
    admins = Array.isArray(a) ? a : [];
    cfgs = Array.isArray(c) ? c : [];
    renderDash();
  } catch(e) { console.error(e); document.getElementById('grid').innerHTML='<div class="card">Error</div>'; }
}

function renderDash(){
  const act=fams.filter(f=>f.estado==='activa').length;
  const neu=halls.filter(h=>!h.borrado_en&&h.estado==='nuevo').length;
  document.getElementById('grid').innerHTML=`
    <div class="card"><h3>Familias</h3><div class="num">${fams.length}</div><small>${act} activas</small></div>
    <div class="card"><h3>Miembros</h3><div class="num">${mems.length}</div></div>
    <div class="card"><h3>Hallazgos</h3><div class="num">${neu}</div><small>nuevos</small></div>
    <div class="card"><h3>Admins</h3><div class="num">${admins.length}</div></div>`;
}

function renderFams(){
  const q=(document.getElementById('qFam').value||'').toLowerCase();
  const rows=fams.filter(f=>(f.nombre_visible||'').toLowerCase().includes(q)||(f.nickname||'').toLowerCase().includes(q));
  document.getElementById('listFams').innerHTML=rows.map(f=>{
    const nm=mems.filter(m=>m.familia_id===f.id).length;
    return `<div class="item">
      <div class="item-top">
        <div><div class="item-title">${f.nombre_visible||'Sin nombre'}</div><div class="item-sub">${f.nickname||'—'} · ${nm} miembros</div></div>
        <span class="badge ${f.estado}">${f.estado}</span>
      </div>
      <div style="margin-top:10px;display:flex;gap:6px">
        <button class="btn" onclick="ver(${f.id})">Ver</button>
        <button class="btn sec" onclick="entrar(${f.id})">Entrar</button>
      </div>
    </div>`;
  }).join('');
}

function ver(id){
  const f=fams.find(x=>x.id===id);
  const ms=mems.filter(m=>m.familia_id===id);
  const cfg=cfgs.find(c=>c.familia_id===id);
  const d=document.getElementById('detFam');
  d.style.display='block';
  d.innerHTML=`<h2>${f.nombre_visible}</h2>
    <div class="row"><span>Nickname</span><span>${f.nickname||'—'}</span></div>
    <div class="row"><span>Estado</span><span class="badge ${f.estado}">${f.estado}</span></div>
    <div class="row"><span>Versión</span><span>${cfg?cfg.version_app:'—'}</span></div>
    <div class="row"><span>Zona</span><span>${cfg?cfg.zona_horaria:'—'}</span></div>
    <h3 style="margin:14px 0 8px;font-size:.95rem">Miembros</h3>
    ${ms.map(m=>`<div class="row"><span>${m.nombre}</span><span>${m.puntos||0} pts${m.es_admin?' · admin':''}</span></div>`).join('')}`;
  d.scrollIntoView({behavior:'smooth'});
}

function entrar(id){
  const f=fams.find(x=>x.id===id);
  if(f&&f.nickname) window.open('/?nick='+encodeURIComponent(f.nickname),'_blank');
}

function renderHall(){
  const q=(document.getElementById('qHall').value||'').toLowerCase();
  const rows=halls.filter(h=>!h.borrado_en&&(h.descripcion||'').toLowerCase().includes(q));
  document.getElementById('listHall').innerHTML=rows.map(h=>{
    const f=fams.find(x=>x.id===h.familia_id);
    return `<div class="item">
      <div class="item-top">
        <div><div class="item-title">${f?f.nombre_visible:'#'+h.familia_id}</div><div class="item-sub">${(h.descripcion||'').slice(0,100)}</div></div>
        <span class="badge ${h.tipo}">${h.tipo}</span>
      </div>
      <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center">
        <span class="badge ${h.estado}">${h.estado}</span>
        <button class="btn sec" onclick="marcar(${h.id})">Revisado</button>
      </div>
    </div>`;
  }).join('');
}

async function marcar(id){
  await fetch(URL+'/rest/v1/famly_hallazgos?id=eq.'+id, {
    method:'PATCH',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({estado:'revisado'})
  });
  toast('Marcado');
  const h=halls.find(x=>x.id===id); if(h) h.estado='revisado';
  renderHall();
}

function renderAdm(){
  document.getElementById('listAdm').innerHTML=admins.map(a=>{
    const f=fams.find(x=>x.id===a.familia_id);
    return `<div class="item">
      <div class="item-title">${a.email||'—'}</div>
      <div class="item-sub">${f?f.nombre_visible:'#'+a.familia_id}</div>
      <button class="btn sec" style="margin-top:8px" onclick="entrar(${a.familia_id})">Entrar</button>
    </div>`;
  }).join('');
}

load();
</script>
</body>
</html>
