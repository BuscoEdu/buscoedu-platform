<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="280" height="140">
  <defs>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Kid 1 -->
  <circle cx="70" cy="55" r="22" fill="#fde68a" filter="url(#soft)"/>
  <rect x="52" y="75" width="36" height="40" rx="14" fill="#93c5fd" filter="url(#soft)"/>
  <!-- Kid 2 -->
  <circle cx="140" cy="50" r="20" fill="#f9a8d4" filter="url(#soft)"/>
  <rect x="124" y="70" width="32" height="38" rx="12" fill="#86efac" filter="url(#soft)"/>
  <!-- Dog -->
  <ellipse cx="210" cy="95" rx="28" ry="18" fill="#fbbf24" filter="url(#soft)"/>
  <circle cx="230" cy="78" r="12" fill="#fbbf24" filter="url(#soft)"/>
  <circle cx="235" cy="75" r="3" fill="#1f2937"/>
  <!-- Ears -->
  <ellipse cx="55" cy="40" rx="8" ry="12" fill="#fde68a" transform="rotate(-20 55 40)" filter="url(#soft)"/>
  <ellipse cx="155" cy="35" rx="7" ry="11" fill="#f9a8d4" transform="rotate(15 155 35)" filter="url(#soft)"/>
</svg>
