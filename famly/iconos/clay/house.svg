<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <filter id="clay" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
    </filter>
    <linearGradient id="roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a8d4"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#bfdbfe"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
  </defs>
  <!-- House body -->
  <rect x="40" y="70" width="120" height="70" rx="18" fill="url(#wall)" filter="url(#clay)"/>
  <!-- Roof -->
  <path d="M30 80 L100 30 L170 80 Z" fill="url(#roof)" filter="url(#clay)"/>
  <!-- Door -->
  <rect x="85" y="100" width="30" height="40" rx="8" fill="#fde68a" filter="url(#clay)"/>
  <!-- Window -->
  <circle cx="60" cy="95" r="12" fill="#fef3c7" filter="url(#clay)"/>
  <circle cx="140" cy="95" r="12" fill="#fef3c7" filter="url(#clay)"/>
  <!-- Chimney -->
  <rect x="130" y="45" width="16" height="25" rx="4" fill="#fca5a5" filter="url(#clay)"/>
</svg>
