<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FAMLY</title>
<!-- mf O4: familia-v1.html ya no sirve la app; redirige siempre a familia.html (aislamiento multi-familia). -->
<script>
/* mf O4: redirect inmediato a familia.html conservando query y hash (?l=, ?tarea=, ?premio=, …). Sin Supabase ni datos. */
(function () {
  var dest = 'familia.html' + (location.search || '') + (location.hash || '');
  try { location.replace(dest); } catch (e) { location.href = dest; }
})();
</script>
<!-- mf O4: si JS está bloqueado, meta lleva a familia.html (sin query estática; el enlace de abajo es el respaldo). -->
<meta http-equiv="refresh" content="0;url=familia.html">
<style>
/* mf O4: respaldo legible en móvil ~390px y web si el redirect no corre. */
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#f8fafc;color:#1e293b;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;padding:24px 16px;text-align:center;box-sizing:border-box;-webkit-font-smoothing:antialiased}
p{margin:0 0 16px;font-size:1rem;line-height:1.4;color:#64748b;max-width:22rem}
a#mf-o4-go{display:inline-block;max-width:100%;padding:14px 22px;border-radius:12px;background:#6366f1;color:#fff;
  text-decoration:none;font-weight:600;font-size:1rem;line-height:1.3}
a#mf-o4-go:focus{outline:3px solid #a5b4fc;outline-offset:3px}
</style>
</head>
<body>
<!-- mf O4: texto + enlace de respaldo accesible (390px); con JS el href incluye query/hash. -->
<p>Te estamos llevando a FAMLY…</p>
<p><a id="mf-o4-go" href="familia.html">Continuar a FAMLY</a></p>
<script>
/* mf O4: actualiza el href del enlace con los mismos parámetros por si location.replace no navegó. */
(function () {
  var a = document.getElementById('mf-o4-go');
  if (a) a.href = 'familia.html' + (location.search || '') + (location.hash || '');
})();
</script>
</body>
</html>
