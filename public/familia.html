<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamiliaTareas</title>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var nameEl = document.getElementById('currentName');
  if (nameEl) nameEl.textContent = 'JS OK · iniciando...';
});
</script>
<style>
:root{--bg:#f8fafc;--primary:#6366f1;--success:#10b981;--text:#1e293b;--muted:#64748b;--border:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px}
header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:20px 16px;border-radius:0 0 24px 24px}
.header-top{display:flex;justify-content:space-between;align-items:center}
.points-badge{background:rgba(255,255,255,.2);padding:8px 14px;border-radius:999px;font-weight:700}
.current-user{margin-top:12px;display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 12px;z-index:100}
.nav-btn{background:none;border:none;font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 12px;border-radius:12px}
.nav-btn.active{color:var(--primary);background:#eef2ff}
.section{display:none;padding:16px}.section.active{display:block}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.small{padding:6px 12px;font-size:.8rem}.btn.success{background:var(--success)}.btn.secondary{background:#e2e8f0;color:var(--text)}
.member-item,.task-item,.reward-item{display:flex;align-items:center;gap:12px;padding:12px;background:#f8fafc;border-radius:12px;margin-bottom:8px}
.form-group{margin-bottom:12px}.form-group label{display:block;font-size:.85rem;margin-bottom:4px;color:var(--muted)}
.form-group input,.form-group select{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.modal.show{display:flex}.modal-content{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px;max-height:85vh;overflow-y:auto}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 20px;border-radius:12px;z-index:300;opacity:0;transition:opacity .3s}.toast.show{opacity:1}
.empty{text-align:center;padding:32px;color:var(--muted)}
.error{color:#ef4444;padding:16px;text-align:center;background:#fef2f2;border-radius:12px;margin:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-top"><div>🏠 Familia</div><div class="points-badge" id="headerPoints">⭐ 0</div></div>
    <div class="current-user"><div class="avatar" id="currentAvatar">👨</div><div><h2 id="currentName">Cargando...</h2><p id="currentRole"></p></div></div>
  </header>
  <div class="section active" id="section-tareas">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3>📋 Tareas</h3><button class="btn small" onclick="openModal('modal-tarea')">+ Nueva</button></div>
    <div id="taskList"><div class="empty">Esperando datos...</div></div>
  </div>
  <div class="section" id="section-premios"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3>🎁 Premios</h3><button class="btn small" onclick="openModal('modal-premio')">+ Nuevo</button></div><div id="rewardList"></div><h4 style="margin:16px 0 8px">Solicitudes</h4><div id="rewardRequests"></div></div>
  <div class="section" id="section-familia"><h3 style="margin-bottom:12px">🏆 Ranking</h3><div id="leaderboard"></div><button class="btn" style="width:100%;margin-top:16px" onclick="switchUser()">Cambiar de usuario</button></div>
  <div class="section" id="section-yo"><div class="card">Mis puntos <span id="myPointsBadge">0</span><br><button class="btn small secondary" style="margin-top:8px" onclick="openModal('modal-puntos')">+/- Ajustar</button></div><div class="card">Historial<div id="history"></div></div></div>
  <nav>
    <button class="nav-btn active" onclick="showSection('tareas')"><span>📋</span>Tareas</button>
    <button class="nav-btn" onclick="showSection('premios')"><span>🎁</span>Premios</button>
    <button class="nav-btn" onclick="showSection('familia')"><span>🏆</span>Ranking</button>
    <button class="nav-btn" onclick="showSection('yo')"><span>👤</span>Yo</button>
  </nav>
</div>
<div class="modal" id="modal-tarea"><div class="modal-content"><h3>Nueva tarea</h3><div class="form-group"><label>Título</label><input id="taskTitle"></div><div class="form-group"><label>Asignar a</label><select id="taskAssignTo"></select></div><div class="form-group"><label>Puntos</label><input type="number" id="taskPoints" value="10"></div><div class="form-group"><label>Recurrencia</label><select id="taskRecurrence"><option value="once">Una vez</option><option value="daily">Diaria</option><option value="weekly">Semanal</option></select></div><button class="btn" style="width:100%" onclick="createTask()">Crear</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="closeModal('modal-tarea')">Cerrar</button></div></div>
<div class="modal" id="modal-premio"><div class="modal-content"><h3>Nuevo premio</h3><div class="form-group"><label>Nombre</label><input id="rewardName"></div><div class="form-group"><label>Costo</label><input type="number" id="rewardCost" value="50"></div><button class="btn" style="width:100%" onclick="createReward()">Crear</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="closeModal('modal-premio')">Cerrar</button></div></div>
<div class="modal" id="modal-usuario"><div class="modal-content"><h3>¿Quién eres?</h3><div id="userSelectList"></div></div></div>
<div class="modal" id="modal-puntos"><div class="modal-content"><h3>Ajustar puntos</h3><div class="form-group"><label>Miembro</label><select id="adjustMember"></select></div><div class="form-group"><label>Puntos</label><input type="number" id="adjustPoints" value="5"></div><div class="form-group"><label>Razón</label><input id="adjustReason"></div><button class="btn" style="width:100%" onclick="adjustPoints()">Aplicar</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="closeModal('modal-puntos')">Cerrar</button></div></div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL = 'https://khnrnnoxyzuulagemfbh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtobnJubm94eXp1dWxhZ2VtZmJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzM1NTMsImV4cCI6MjA5ODEwOTU1M30.uN8Vm9H-Na92r6UPOsP39F6pGwU6M_K6C4HJ5Tq-2Ts';

let supabase;
let state = { currentUserId: 1, members: [], tasks: [], rewards: [], requests: [], history: [] };

function setStatus(title, sub) {
  const n = document.getElementById('currentName');
  const r = document.getElementById('currentRole');
  if (n) n.textContent = title;
  if (r) r.textContent = sub || '';
}

function loadSupabaseLib() {
  return new Promise((resolve, reject) => {
    if (window.supabase && window.supabase.createClient) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js';
    s.onload = () => {
      setTimeout(() => {
        if (window.supabase && window.supabase.createClient) resolve();
        else reject(new Error('La librería cargó pero no expuso createClient'));
      }, 100);
    };
    s.onerror = () => reject(new Error('No se pudo cargar la librería de Supabase desde el CDN'));
    document.head.appendChild(s);
  });
}

async function start() {
  setStatus('JS OK', 'Cargando librería...');
  try {
    await loadSupabaseLib();
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    setStatus('Conectado', 'Cargando familia...');
    await loadAll();
  } catch (e) {
    console.error(e);
    setStatus('Error', e.message);
    document.getElementById('taskList').innerHTML = '<div class="error">' + e.message + '</div>';
  }
}

async function loadAll() {
  const [m, t, p, r, h] = await Promise.all([
    supabase.from('familia_miembros').select('*').order('id'),
    supabase.from('familia_tareas').select('*').order('creado_en', { ascending: false }),
    supabase.from('familia_premios').select('*'),
    supabase.from('familia_solicitudes_premios').select('*').eq('estado', 'pendiente'),
    supabase.from('familia_historial').select('*').order('creado_en', { ascending: false }).limit(15)
  ]);
  if (m.error) throw new Error('Miembros: ' + m.error.message);
  if (t.error) throw new Error('Tareas: ' + t.error.message);
  state.members = m.data || [];
  state.tasks = t.data || [];
  state.rewards = p.data || [];
  state.requests = r.data || [];
  state.history = h.data || [];
  if (!state.members.length) {
    setStatus('Sin datos', 'La tabla familia_miembros está vacía');
    return;
  }
  render();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function showSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + name).classList.add('active');
  event?.currentTarget?.classList.add('active');
}
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function getMember(id) { return state.members.find(m => m.id === id); }
function currentUser() { return getMember(state.currentUserId) || state.members[0]; }

function render() {
  const u = currentUser();
  if (!u) return;
  document.getElementById('currentAvatar').textContent = u.emoji || '👤';
  document.getElementById('currentName').textContent = u.nombre;
  document.getElementById('currentRole').textContent = u.rol + (u.edad ? ' · ' + u.edad + ' años' : '');
  document.getElementById('headerPoints').textContent = '⭐ ' + u.puntos;
  document.getElementById('myPointsBadge').textContent = u.puntos + ' pts';

  const pending = state.tasks.filter(t => !['completada','rechazada'].includes(t.estado));
  document.getElementById('taskList').innerHTML = pending.length ? pending.map(t => {
    const a = getMember(t.asignada_a);
    const canComplete = t.asignada_a === state.currentUserId && t.estado === 'pendiente';
    const canApprove = t.creada_por === state.currentUserId && t.estado === 'esperando_aprobacion';
    return `<div class="task-item"><div style="font-size:1.5rem">${a?.emoji||'👤'}</div><div style="flex:1"><strong>${t.titulo}</strong><br><small>A ${a?.nombre||'?'} · +${t.puntos} pts · ${t.estado}</small></div><div>${canComplete?`<button class="btn small success" onclick="completeTask(${t.id})">Hecho</button>`:''}${canApprove?`<button class="btn small success" onclick="approveTask(${t.id})">Aprobar</button>`:''}</div></div>`;
  }).join('') : '<div class="empty">🎉 No hay tareas pendientes</div>';

  document.getElementById('rewardList').innerHTML = state.rewards.map(r => `<div class="reward-item"><div style="font-size:1.5rem">🎁</div><div style="flex:1"><strong>${r.nombre}</strong><br><small>${r.costo} pts</small></div>${u.puntos>=r.costo?`<button class="btn small success" onclick="requestReward(${r.id})">Solicitar</button>`:`<small>Faltan ${r.costo-u.puntos}</small>`}</div>`).join('') || '<div class="empty">Sin premios</div>';

  document.getElementById('rewardRequests').innerHTML = state.requests.map(req => {
    const rw = state.rewards.find(x => x.id === req.premio_id);
    const m = getMember(req.miembro_id);
    return `<div class="reward-item"><div>${m?.emoji||'👤'}</div><div style="flex:1">${m?.nombre} pide "${rw?.nombre}"</div><button class="btn small success" onclick="approveRequest(${req.id})">Aprobar</button></div>`;
  }).join('') || '<p style="color:var(--muted)">Sin solicitudes</p>';

  const sorted = [...state.members].sort((a,b) => b.puntos - a.puntos);
  document.getElementById('leaderboard').innerHTML = sorted.map((m,i) => `<div class="member-item"><div>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div><div style="font-size:1.5rem">${m.emoji||'👤'}</div><div style="flex:1"><strong>${m.nombre}</strong><br><small>${m.rol}</small></div><strong>${m.puntos} pts</strong></div>`).join('');

  document.getElementById('history').innerHTML = state.history.slice(0,8).map(h => `<div style="padding:6px 0;border-bottom:1px solid #f1f5f9">${h.texto}</div>`).join('') || 'Sin actividad';

  document.getElementById('taskAssignTo').innerHTML = state.members.filter(m => m.id !== state.currentUserId).map(m => `<option value="${m.id}">${m.emoji||''} ${m.nombre}</option>`).join('');
  document.getElementById('adjustMember').innerHTML = state.members.map(m => `<option value="${m.id}">${m.nombre}</option>`).join('');
}

async function createTask() {
  const titulo = document.getElementById('taskTitle').value.trim();
  const asignada_a = +document.getElementById('taskAssignTo').value;
  const puntos = +document.getElementById('taskPoints').value || 10;
  const recurrencia = document.getElementById('taskRecurrence').value;
  if (!titulo || !asignada_a) return showToast('Completa los campos');
  const { error } = await supabase.from('familia_tareas').insert({ titulo, asignada_a, creada_por: state.currentUserId, puntos, recurrencia, estado: 'pendiente' });
  if (error) return showToast('Error: ' + error.message);
  closeModal('modal-tarea');
  showToast('Tarea creada');
  loadAll();
}
async function completeTask(id) {
  const { error } = await supabase.from('familia_tareas').update({ estado: 'esperando_aprobacion' }).eq('id', id);
  if (error) return showToast('Error: ' + error.message);
  showToast('Enviada');
  loadAll();
}
async function approveTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  const member = getMember(task.asignada_a);
  await supabase.from('familia_tareas').update({ estado: 'completada' }).eq('id', id);
  await supabase.from('familia_miembros').update({ puntos: member.puntos + task.puntos }).eq('id', task.asignada_a);
  await supabase.from('familia_historial').insert({ miembro_id: task.asignada_a, texto: member.nombre + ' recibió +' + task.puntos + ' pts por "' + task.titulo + '"' });
  if (task.recurrencia !== 'once') {
    await supabase.from('familia_tareas').insert({ titulo: task.titulo, asignada_a: task.asignada_a, creada_por: task.creada_por, puntos: task.puntos, recurrencia: task.recurrencia, estado: 'pendiente' });
  }
  showToast('Aprobado!');
  loadAll();
}
async function createReward() {
  const nombre = document.getElementById('rewardName').value.trim();
  const costo = +document.getElementById('rewardCost').value || 50;
  if (!nombre) return;
  const { error } = await supabase.from('familia_premios').insert({ nombre, costo, creado_por: state.currentUserId });
  if (error) return showToast('Error: ' + error.message);
  closeModal('modal-premio');
  showToast('Premio creado');
  loadAll();
}
async function requestReward(id) {
  const { error } = await supabase.from('familia_solicitudes_premios').insert({ premio_id: id, miembro_id: state.currentUserId, estado: 'pendiente' });
  if (error) return showToast('Error: ' + error.message);
  showToast('Solicitud enviada');
  loadAll();
}
async function approveRequest(id) {
  const req = state.requests.find(x => x.id === id);
  const m = getMember(req.miembro_id);
  const r = state.rewards.find(x => x.id === req.premio_id);
  if (m.puntos < r.costo) return showToast('Puntos insuficientes');
  await supabase.from('familia_miembros').update({ puntos: m.puntos - r.costo }).eq('id', m.id);
  await supabase.from('familia_solicitudes_premios').update({ estado: 'aprobada' }).eq('id', id);
  await supabase.from('familia_historial').insert({ miembro_id: m.id, texto: m.nombre + ' canjeó "' + r.nombre + '"' });
  showToast('Aprobado');
  loadAll();
}
async function adjustPoints() {
  const mid = +document.getElementById('adjustMember').value;
  const pts = +document.getElementById('adjustPoints').value;
  const reason = document.getElementById('adjustReason').value;
  const m = getMember(mid);
  await supabase.from('familia_miembros').update({ puntos: m.puntos + pts }).eq('id', mid);
  await supabase.from('familia_historial').insert({ miembro_id: mid, texto: currentUser().nombre + ' ajustó ' + (pts>0?'+':'') + pts + ' pts a ' + m.nombre + ': ' + reason });
  closeModal('modal-puntos');
  showToast('Ajustado');
  loadAll();
}
function switchUser() {
  document.getElementById('userSelectList').innerHTML = state.members.map(m => `<div class="member-item" style="cursor:pointer" onclick="selectUser(${m.id})"><div style="font-size:1.5rem">${m.emoji||'👤'}</div><div><strong>${m.nombre}</strong><br><small>${m.rol} · ${m.puntos} pts</small></div></div>`).join('');
  openModal('modal-usuario');
}
function selectUser(id) {
  state.currentUserId = id;
  localStorage.setItem('familia_current', id);
  closeModal('modal-usuario');
  render();
}

state.currentUserId = +localStorage.getItem('familia_current') || 1;
start();
</script>
</body>
</html>
