<!DOCTYPE html><html lang=es><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>FamiliaTareas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script><style>:root{--bg:#f8fafc;--primary:#6366f1;--success:#10b981;--danger:#ef4444;--text:#1e293b;--muted:#64748b;--border:#e2e8f0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px}header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:20px 16px;border-radius:0 0 24px 24px}.header-top{display:flex;justify-content:space-between;align-items:center}.points-badge{background:rgba(255,255,255,.2);padding:8px 14px;border-radius:999px;font-weight:700}.current-user{margin-top:12px;display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 12px;z-index:100;overflow-x:auto}.nav-btn{background:none;border:none;font-size:.7rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 8px;border-radius:12px;position:relative;min-width:60px}.nav-btn.active{color:var(--primary);background:#eef2ff}.section{display:none;padding:16px}.section.active{display:block}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}.btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}.btn.small{padding:6px 12px;font-size:.8rem}.btn.success{background:var(--success)}.btn.danger{background:var(--danger)}.btn.secondary{background:#e2e8f0;color:var(--text)}.member-item,.task-item,.reward-item{display:flex;align-items:center;gap:12px;padding:12px;background:#f8fafc;border-radius:12px;margin-bottom:8px;border-left:4px solid #6366f1}.form-group{margin-bottom:12px}.form-group label{display:block;font-size:.85rem;margin-bottom:4px;color:var(--muted)}.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}.modal.show{display:flex}.modal-content{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px;max-height:85vh;overflow-y:auto}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 20px;border-radius:12px;z-index:300;opacity:0;transition:opacity .3s}.toast.show{opacity:1}.login-screen{position:fixed;inset:0;background:#fff;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}</style></head><body><div class=login-screen id=loginScreen><h2 style=margin-bottom:16px>🏠 Entrar</h2><div class=form-group style=width:100%;max-width:320px><label>Soy</label><select id=loginMember></select></div><div class=form-group style=width:100%;max-width:320px><label>PIN</label><input id=loginPin type=password placeholder=oooo maxlength=8></div><button class=btn style=width:100%;max-width:320px onclick=doLogin()>Entrar</button><p style=margin-top:12px;color:var(--muted);font-size:.85rem>PIN por defecto: oooo</p></div><div class=app id=mainApp style=display:none><header><div class=header-top><div id=familyTitle>🏠 Familia</div><div class=points-badge id=headerPoints>⭐ 0</div></div><div class=current-user><div class=avatar id=currentAvatar>👨</div><div><h2 id=currentName>...</h2><p id=currentRole></p></div></div></header><div class="section active" id=section-tareas><h3>📋 Tareas</h3><div id=taskList></div></div><nav><button class="nav-btn active" onclick=showSection('tareas')>📋<br>Tareas</button><button class=nav-btn onclick=showSection('premios')>🎁<br>Premios</button><button class=nav-btn onclick=showSection('ranking')>🏆<br>Ranking</button><button class=nav-btn onclick=showSection('yo')>👤<br>Yo</button></nav></div><div id=toast class=toast></div><script>const SUPABASE_URL='https://khnrnnoxyzuulagemfbh.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtobnJubm94eXp1dWxhZ2VtZmJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzM1NTMsImV4cCI6MjA5ODEwOTU1M30.uN8Vm9H-Na92r6UPOsP39F6pGwU6M_K6C4HJ5Tq-2Ts';let supabase,state={members:[],tasks:[],rewards:[],historial:[],mensajes:[],currentUserId:null};function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}function currentUser(){return state.members.find(m=>m.id===state.currentUserId)}function isAdmin(u){return u&&/padre|mamá|papa|madre/i.test(u.rol||'')}async function loadAll(){const {data:m}=await supabase.from('familia_miembros').select('*');state.members=m||[];const {data:t}=await supabase.from('familia_tareas').select('*');state.tasks=t||[];const {data:r}=await supabase.from('familia_premios').select('*');state.rewards=r||[];render()}function render(){const u=currentUser();if(!u)return;document.getElementById('currentName').textContent=u.nombre;document.getElementById('currentRole').textContent=u.rol;document.getElementById('headerPoints').textContent='⭐ '+(u.puntos||0);const tasks=state.tasks.filter(t=>t.asignada_a===u.id||isAdmin(u));document.getElementById('taskList').innerHTML=tasks.map(t=>`<div class=task-item>${t.titulo} (${t.puntos} pts) <button class="btn small" onclick=startComplete(${t.id})>Hecho</button></div>`).join('')||'<p>Sin tareas</p>'}function showSection(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('section-'+id).classList.add('active')}async function doLogin(){const id=+document.getElementById('loginMember').value;const pin=document.getElementById('loginPin').value;const m=state.members.find(x=>x.id===id);if(!m|| (m.pin&&m.pin!==pin)) return showToast('PIN incorrecto');state.currentUserId=id;localStorage.setItem('familia_current',id);document.getElementById('loginScreen').style.display='none';document.getElementById('mainApp').style.display='';render()}function startComplete(id){if(confirm('Marcar como hecha? (foto opcional)')){supabase.from('familia_tareas').update({estado:'esperando_aprobacion'}).eq('id',id);showToast('Enviada');loadAll()}}function confirmResetAll(){if(!confirm('¿Borrar todo el historial y puntos?'))return;if(!confirm('Confirmación final: ¿empezar desde cero?'))return;resetAll()}async function resetAll(){const u=currentUser();if(!u||!/padre|papá/i.test(u.rol||''))return showToast('Solo papá');await supabase.from('familia_tareas').delete().neq('id',0);await supabase.from('familia_historial').delete().neq('id',0);await supabase.from('familia_miembros').update({puntos:0});showToast('Reseteado');loadAll()}async function init(){supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);await loadAll();document.getElementById('loginMember').innerHTML=state.members.map(m=>`<option value="${m.id}">${m.emoji||''} ${m.nombre}</option>`).join('');const saved=+localStorage.getItem('familia_current');if(saved&&state.members.find(m=>m.id===saved)){state.currentUserId=saved;document.getElementById('loginScreen').style.display='none';document.getElementById('mainApp').style.display='';render()}}init();</script></body></html>
